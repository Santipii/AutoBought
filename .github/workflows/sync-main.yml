
name: Sync branches with upstream

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main and dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/JoaquinRodriguez07/AutoBought.git
          git fetch origin
          git fetch upstream main dev

          for branch in main dev; do
            git checkout "$branch"
            git merge --no-edit "upstream/$branch"
            git push origin "$branch"
          done
